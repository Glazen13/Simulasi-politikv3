<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101a36">
<title>Simulator Parti Politik Malaysia</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- SKRIN 1: PERMULAAN -->
  <section id="s-start" class="screen active">
    <div class="splash">
      <div class="flagbar" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="logo">🏛️</div>
      <h1>Simulator Parti Politik Malaysia</h1>
      <p class="sub">Urus parti, hadapi krisis, tempuh PRU dan bentuk kerajaan. Rujukan konsep: Kempen 222.</p>
      <button class="btn big" data-act="newgame">Main baharu</button>
      <button class="btn ghost big" id="btn-continue" data-act="cont" hidden>Sambung permainan</button>
      <button class="btn ghost" data-act="about">Cara bermain</button>
      <p class="note">Versi 3.0. Angka, calon dan berita dalam simulasi ialah data rekaan atau anggaran kecuali dinyatakan. Ini bukan sumber rasmi.</p>
    </div>
  </section>

  <!-- SKRIN 2-5: MOD, LALUAN, BORANG, PENGESAHAN (dijana oleh script.js) -->
  <section id="s-mode" class="screen"></section>
  <section id="s-path" class="screen"></section>
  <section id="s-setup" class="screen"></section>
  <section id="s-confirm" class="screen"></section>

  <!-- SKRIN 6: PERMAINAN UTAMA -->
  <section id="s-game" class="screen">
    <header id="g-head"></header>
    <main id="g-main"></main>
    <nav id="g-nav" aria-label="Menu utama">
      <button data-act="tab" data-v="home"><span>🏠</span>Utama</button>
      <button data-act="tab" data-v="act"><span>📣</span>Tindakan</button>
      <button data-act="tab" data-v="gov"><span>🏛️</span>Kerajaan</button>
      <button data-act="tab" data-v="money"><span>💰</span>Wang</button>
      <button data-act="tab" data-v="party"><span>🚩</span>Parti</button>
      <button data-act="tab" data-v="world"><span>🌏</span>Dunia</button>
      <button data-act="tab" data-v="mis"><span>🎯</span>Misi</button>
      <button data-act="pause"><span>⏸️</span>Menu</button>
    </nav>
  </section>

  <!-- SKRIN 7: PILIHAN RAYA -->
  <section id="s-election" class="screen"></section>

</div>

<div id="modal"><div id="modal-card"><div id="modal-body"></div></div></div>
<div id="toast" role="status"></div>

<script src="script.js"></script>
</body>
</html>
